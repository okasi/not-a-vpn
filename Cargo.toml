[package]
name = "not-a-vpn"
version = "0.1.0"
edition = "2024"

[dependencies]
async-net = "2"
async-native-tls = "0.5"
dirs = "6"
fastrand = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
tao = "0.30"
tray-icon = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }
winreg = "0.55"
